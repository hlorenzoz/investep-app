server {
    listen 80;
    server_name localhost;

    # Compresión Gzip para optimizar la carga de los bundles de Flutter Web
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location /api/ {
        # DNS embebido de Docker: resuelve investep-api en tiempo de request,
        # no al arrancar. Así nginx levanta aunque la API aún no exista.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $investep_api investep-api:8787;
        rewrite ^/api/(.*)$ /$1 break;   # replica el strip del trailing slash
        proxy_pass http://$investep_api; # variable => resolución diferida

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para CORS preflight y headers necesarios
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Soporte para ruteo SPA (GoRouter con Path URL Strategy)
        try_files $uri $uri/ /index.html;
    }

    # Caché estricto para assets estáticos que tienen hashes en el nombre
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        root /usr/share/nginx/html;
        expires 6M;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
