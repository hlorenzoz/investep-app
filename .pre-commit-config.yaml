# Hooks de calidad. Integrado con pre-commit.ci (corre en cada PR).
# No te saltes los hooks con --no-verify salvo emergencia justificada (AGENTS.md §6).
#
# Instalar localmente:  pre-commit install
# Correr a mano:        just hooks
ci:
  autofix_prs: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending

  # Hooks de Dart/Flutter ejecutados localmente (requieren el SDK en el PATH).
  - repo: local
    hooks:
      - id: dart-format
        name: dart format
        entry: dart format --set-exit-if-changed
        language: system
        types: [dart]
        pass_filenames: true

      - id: flutter-analyze
        name: flutter analyze
        entry: flutter analyze
        language: system
        types: [dart]
        pass_filenames: false
